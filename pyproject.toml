[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline"
version = "0.1.0"
description = "Foundation for a real-time smart retail video analytics pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "somiaamari" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
detection = [
    "torch>=2.0",
    "ultralytics>=8.2",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnxsim>=0.4.36",
    "onnxconverter-common>=1.14",
]
export = [
    "ultralytics>=8.2",
    "torch>=2.0",
]
tracking-ref = [
    "supervision>=0.22",
]
eval = [
    "motmetrics>=1.4",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"] 
ignore = ["I001"]             

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["vision_pipeline"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_detection: tests requiring the optional Ultralytics detection extra",
    "requires_eval: tests requiring motmetrics from the optional evaluation extra",
    "requires_onnx: tests requiring the optional ONNX CPU extra",
]
